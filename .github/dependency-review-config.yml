# Allow the SPDX identifiers present in the repository's existing dependency graph.
# This is an admission policy, not a legal assessment of license compatibility.
allow-licenses:
  - 0BSD
  - Apache-2.0
  - BSD-2-Clause
  - BSD-2-Clause-Views
  - BSD-3-Clause
  - BlueOak-1.0.0
  - CC-BY-4.0
  - CC0-1.0
  - ISC
  - JSON
  - LGPL-3.0-or-later
  - MIT
  - MPL-2.0
  - MS-PL
  - Python-2.0

# Keep nonstandard LicenseRef exceptions scoped to currently reviewed package versions.
allow-dependencies-licenses:
  # LicenseRef-scancode-sonar-sal-1.0
  - pkg:nuget/SonarAnalyzer.CSharp@10.35.0.4138
  # LicenseRef-scancode-ms-net-library-2018-11
  - pkg:nuget/Microsoft.Testing.Extensions.CodeCoverage@18.11.0

license-check: true
vulnerability-check: true
comment-summary-in-pr: never
retry-on-snapshot-warnings: true
retry-on-snapshot-warnings-timeout: 300
