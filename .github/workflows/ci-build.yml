name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  deployment-tests:
    name: Deployment automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test deployment automation without credentials or network
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  event:
    name: Preserve CI event for test reporting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve original workflow event
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-event
          path: ${{ github.event_path }}
          if-no-files-found: error
          retention-days: 14

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js for Aspire frontend integration
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            JerryChart.Web/package-lock.json
            JerryChart.Web/tooling/lint/package-lock.json

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore JerryChart.slnx

      - name: Build
        run: dotnet build JerryChart.slnx --configuration Release --no-restore -warnaserror

      - name: Run Microsoft.Testing.Platform tests
        run: dotnet test --solution JerryChart.slnx --configuration Release --no-build --report-trx

      - name: Preserve test results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results
          path: |
            **/TestResults/**
            **/test-results/**
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: JerryChart.Web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            JerryChart.Web/package-lock.json
            JerryChart.Web/tooling/lint/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=frontend-tests.xml
          tests/*.test.cjs

      - name: Build
        run: npm run build

      - name: Install browser for interaction regressions
        run: npx playwright install --with-deps chromium

      - name: Test real browser interactions
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=browser-tests.xml
          tests/browser/*.test.cjs

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: |
            JerryChart.Web/frontend-tests.xml
            JerryChart.Web/browser-tests.xml
          if-no-files-found: warn
          retention-days: 14
