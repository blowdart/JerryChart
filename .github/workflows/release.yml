name: Publish release images

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: jerrychart-release
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/idunno-registry

jobs:
  build:
    name: Build verified main images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require successful checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in ci-build.yml codeql.yml zizmor.yml; do
            result="$(gh api \
              "repos/$REPOSITORY/actions/workflows/$workflow/runs?head_sha=$COMMIT&event=push&per_page=1" \
              --jq '.workflow_runs[0] | {id, run_attempt, head_sha, status, conclusion, html_url}')"
            echo "$workflow: $result"
            if ! jq -e --arg sha "$COMMIT" \
              '.head_sha == $sha and .status == "completed" and .conclusion == "success"' \
              <<< "$result" > /dev/null; then
              echo "::error::$workflow must have a completed successful push run for this commit."
              exit 1
            fi
          done

      - name: Check out verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and export images
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --target api -t "$REGISTRY/jerrychart-api:$tag" .
          docker build --target monitor -t "$REGISTRY/jerrychart-monitor:$tag" .
          docker build -f JerryChart.Web/Dockerfile -t "$REGISTRY/jerrychart-web:$tag" .
          docker save \
            "$REGISTRY/jerrychart-api:$tag" \
            "$REGISTRY/jerrychart-monitor:$tag" \
            "$REGISTRY/jerrychart-web:$tag" | gzip > release-images.tar.gz

      - name: Preserve images for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          path: release-images.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to DigitalOcean Container Registry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
    steps:
      - name: Download built images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-images

      - name: Load images
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c release-images.tar.gz | docker load

      - name: Set up DigitalOcean CLI
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate to registry
        run: doctl registry login --expiry-seconds 900

      - name: Publish images and record immutable references
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '### Release images\n\nCommit: `%s`\n\n' "$GITHUB_SHA" > release-images.md
          for component in api monitor web; do
            image="$REGISTRY/jerrychart-$component:$tag"
            docker push "$image"
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
            printf -- '- `%s`\n' "$digest" >> release-images.md
          done
          cat release-images.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve release image references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-references
          path: release-images.md
          if-no-files-found: error
          retention-days: 90

      - name: Remove registry credentials
        if: always()
        run: |
          docker logout "$REGISTRY"
          doctl auth remove --context default
